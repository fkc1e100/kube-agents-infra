apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-applications
  namespace: argocd
  annotations:
    description: "Reconciles application tier workloads (Cost Dashboard, OpenRL, simple apps, benchmarks)."
spec:
  project: default
  source:
    repoURL: https://github.com/fkc1e100/kube-agents-apps.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
