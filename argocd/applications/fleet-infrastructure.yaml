apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-infrastructure
  namespace: argocd
  annotations:
    description: "Reconciles platform-wide infrastructure manifests, base network policies, and cluster hygiene."
spec:
  project: default
  source:
    repoURL: https://github.com/fkc1e100/kube-agents-infra.git
    targetRevision: HEAD
    path: manifests/infra
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
