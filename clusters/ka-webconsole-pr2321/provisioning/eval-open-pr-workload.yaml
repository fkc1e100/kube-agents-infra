apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-open-pr-workload
  namespace: eval-autoops-open-pr
  labels:
    app: eval-open-pr-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-open-pr-workload
  template:
    metadata:
      labels:
        app: eval-open-pr-workload
    spec:
      automountServiceAccountToken: false
      containers:
        - name: allocator
          image: busybox:1.36
          command: ["sh", "-c", "dd if=/dev/zero of=/dev/null bs=96M count=1 && sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 64Mi
