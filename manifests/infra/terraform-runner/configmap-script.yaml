apiVersion: v1
kind: ConfigMap
metadata:
  name: terraform-runner-scripts
  namespace: argocd
data:
  run-terraform.sh: |
    #!/bin/sh
    set -euo pipefail

    echo "=== 1. Starting Fleet Terraform GitOps Reconciliation ==="
    echo "Timestamp: $(date -u)"

    WORKDIR="/tmp/infra-repo"
    rm -rf "$WORKDIR"
    mkdir -p "$WORKDIR"

    echo ">>> Cloning fkc1e100/kube-agents-infra at HEAD <<<"
    git clone --depth 1 https://github.com/fkc1e100/kube-agents-infra.git "$WORKDIR"
    cd "$WORKDIR"

    export TF_IN_AUTOMATION=1
    export GOOGLE_APPLICATION_CREDENTIALS=""

    # 1. Reconcile gca-gke-test environment
    echo ">>> [gca-gke-test] Initializing and validating Terraform <<<"
    cd "$WORKDIR/terraform/environments/gca-gke-test"
    terraform init -input=false
    terraform validate
    echo ">>> [gca-gke-test] Generating execution plan <<<"
    terraform plan -input=false -out=tfplan-test || true

    # 2. Reconcile gca-gke-2025 environment
    echo ">>> [gca-gke-2025] Initializing and validating Terraform <<<"
    cd "$WORKDIR/terraform/environments/gca-gke-2025"
    terraform init -input=false
    terraform validate
    echo ">>> [gca-gke-2025] Generating execution plan <<<"
    terraform plan -input=false -out=tfplan-2025 || true

    echo "=== Fleet Terraform GitOps Reconciliation Complete ==="
