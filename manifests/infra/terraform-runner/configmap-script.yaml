apiVersion: v1
kind: ConfigMap
metadata:
  name: terraform-runner-scripts
  namespace: argocd
data:
  run-terraform.sh: |
    #!/bin/sh
    set -euo pipefail

    echo "=== 1. Starting Fleet Terraform GitOps Reconciliation ==="
    echo "Timestamp: $(date -u)"

    WORKDIR="/tmp/infra-repo"
    rm -rf "$WORKDIR"
    mkdir -p "$WORKDIR"

    echo ">>> Cloning fkc1e100/kube-agents-infra at HEAD <<<"
    git clone --depth 1 https://github.com/fkc1e100/kube-agents-infra.git "$WORKDIR"
    cd "$WORKDIR"

    export TF_IN_AUTOMATION=1
    export GOOGLE_APPLICATION_CREDENTIALS=""

    reconcile_env() {
      ENV_NAME="$1"
      ENV_DIR="$WORKDIR/terraform/environments/$ENV_NAME"
      echo "=== Processing Environment: $ENV_NAME ==="
      if [ ! -d "$ENV_DIR" ]; then
        echo "Directory $ENV_DIR not found, skipping."
        return
      fi

      for SUBDIR in "$ENV_DIR"/*/; do
        if [ -f "$SUBDIR/main.tf" ]; then
          TARGET="$(basename "$SUBDIR")"
          echo ">>> [$ENV_NAME / $TARGET] Initializing and validating Terraform <<<"
          (
            cd "$SUBDIR"
            terraform init -input=false
            terraform validate
            echo ">>> [$ENV_NAME / $TARGET] Generating execution plan <<<"
            terraform plan -input=false -out=tfplan || true
          )
        fi
      done
    }

    # 1. Reconcile gca-gke-test environment (per-cluster roots & networks)
    reconcile_env "gca-gke-test"

    # 2. Reconcile gca-gke-2025 environment (per-cluster roots & networks)
    reconcile_env "gca-gke-2025"

    echo "=== Fleet Terraform GitOps Reconciliation Complete ==="
