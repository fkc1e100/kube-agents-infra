apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-terraform-runner-role
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-terraform-runner-binding
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-terraform-runner-role
subjects:
  - kind: ServiceAccount
    name: fleet-terraform-runner
    namespace: argocd
