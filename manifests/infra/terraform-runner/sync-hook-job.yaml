apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-terraform-reconciler
  namespace: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    description: "Executes Terraform plan and reconciliation when PRs merge into kube-agents-infra"
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-terraform-reconciler
    spec:
      serviceAccountName: fleet-terraform-runner
      restartPolicy: OnFailure
      containers:
        - name: terraform
          image: hashicorp/terraform:1.9
          command: ["/bin/sh", "/scripts/run-terraform.sh"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
      volumes:
        - name: script-vol
          configMap:
            name: terraform-runner-scripts
            defaultMode: 0755
